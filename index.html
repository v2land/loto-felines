<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loto 10/49 — Félines M15 B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f7;--surface:#fff;--ink:#0f1b2d;--muted:#5a6a7e;--line:#d5dfe9;--accent:#d4a017;--accent-ink:#1a1300;--ok:#1f7a4d;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;--bg:#0a121e;--surface:#121d2c;--ink:#e8eef5;--muted:#93a3b7;--line:#26374d;--accent:#e8b82e;--ok:#3a9e6e}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:1rem}
.hero{background:#13294b;color:#fff;border-radius:18px;padding:1.4rem 1.3rem;position:relative;overflow:hidden}
.stripes{position:absolute;right:-30px;top:0;bottom:0;width:100px;background:repeating-linear-gradient(115deg,transparent 0 18px,rgba(212,160,23,.9) 18px 30px)}
.kicker{color:#f2c94c;font-weight:600}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:clamp(2.2rem,9vw,3.2rem);line-height:1.05;margin:0}
.hero p{opacity:.9;margin:.4rem 0 0;max-width:30ch}
a.choice{display:block;text-decoration:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem;margin-top:.8rem}
a.choice strong{display:block;font-family:"Barlow Condensed",sans-serif;font-size:1.6rem;font-weight:800}
a.choice span{color:var(--muted)}
a.choice.friend{border-left:6px solid var(--accent)}
a.choice.parent{border-left:6px solid var(--ok)}
a.choice:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="stripes" aria-hidden="true"></div>
    <div class="kicker">Financement hockey féminin · Saison 26-27</div>
    <h1>Loto 10/49<br>Félines M15 B</h1>
    <p>5 $ la série de 10 numéros · 500 $ au gagnant</p>
  </header>
  <a class="choice friend" href="amis.html"><strong>Je suis un ami</strong><span>Je choisis mes numéros et j'envoie mon message à la joueuse.</span></a>
  <a class="choice parent" href="parent.html"><strong>Je suis une joueuse ou un parent</strong><span>J'inscris les séries vendues et j'envoie la feuille à Isabelle.</span></a>
</div>
</body>
</html>
